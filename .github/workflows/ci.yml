name: CI

# Push-to-main runs these checks through deploy.yml, which calls this workflow
on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (lint)
        run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Build client assets
        run: npm run build
